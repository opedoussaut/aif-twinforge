<?xml version="1.0" encoding="utf-8"?>
<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="autoRefresh" content="0" />
    <title>aif-twinforge</title>
    <!-- Loads bundle.js next to this page, tagged with the deployed build so the dashboard never
         serves a stale one. Replaced by a module script under the Vite dev server. -->
    <script type="text/javascript">
      (function () {
        var base = './';
        if (window.widget && widget.uwaUrl)
          base = widget.uwaUrl.slice(0, widget.uwaUrl.lastIndexOf('/') + 1);
        fetch(base + 'static/version.json?ts=' + Date.now())
          .then(function (r) {
            return r.json();
          })
          .then(function (v) {
            var s = document.createElement('script');
            s.src = base + 'bundle.js?v=' + encodeURIComponent(v.build);
            document.head.appendChild(s);
          })
          .catch(function () {
            document.body.textContent = 'The widget could not be loaded. Refresh to try again.';
          });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
